# ---------------------------------------------------------------------------
# Perfil "demo": arranca la API sin MySQL usando una base de datos H2 en
# memoria con los mismos datos del catálogo.
#
#   mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=demo
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:catalogo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
