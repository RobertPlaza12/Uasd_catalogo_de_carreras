spring.application.name=catalogo-carreras
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Base de datos MySQL (XAMPP, WAMP o MySQL Server).
# Importa backend/database/catalogo_carreras.sql antes de arrancar la API.
# Puedes sobreescribir estos valores con las variables de entorno
# DB_URL, DB_USERNAME y DB_PASSWORD, o editando este archivo.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/catalogo_carreras?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Si el backend tarda en conectar con MySQL, aumenta este valor.
spring.datasource.hikari.connection-timeout=10000
